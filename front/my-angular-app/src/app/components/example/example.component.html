<div class="container">
  <h1>Aplicación Angular</h1>
  <button (click)="sendMessage()">Enviar mensaje a AngularJS</button>
  <p>Mensaje de AngularJS: {{messageFromAngularJS}}</p>
</div>


<div class="container">
  <h1>Example Component</h1>
  <!-- <form (ngSubmit)="onSubmit()"> -->
  <!-- <form> -->
  <label for="clave">Ingrese clave</label>
  <br>
  <input type="text" id="clave" class="form-control" #keyLocalStorage>
  <br>
  <label for="valor">Ingrese valor</label>
  <br>
  <input type="text" id="valor" class="form-control" #valueLocalStorage>
  <br>
  <button (click)="setData(keyLocalStorage.value, valueLocalStorage.value)">Guardar en LocalStorage</button>
  <!-- </form> -->
</div>

<div class="container">
  <h2>LocalStorage</h2>
  <label for="claveBuscar">Ingrese clave</label>
  <br>
  <input type="text" id="claveBuscar" class="form-control" #keySearch>
  <br>
  <button (click)="getData(keySearch.value)">Obtener de LocalStorage</button>
  <p *ngIf="storedValue">Valor: {{ storedValue || "none" }}</p>
  <p *ngIf="storedValue == null">Clave no encontrada.</p>
</div>
